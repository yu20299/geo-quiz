ction":"2-2 臺灣的位置及其影響","topic":"臺灣緯度位置","answerSource":"AI答案卷（使用者提供）","answerStatus":"已核對"},{"n":17,"q":"台灣的面積不大，但物種數量的平均值卻是世界平均值的 100 倍，可見台灣生物種類之多。台灣生物具有多樣性的原因和下列何者的關聯性「最低」？","o":["地勢起伏大","高溫多雨的氣候","位於海陸接觸地帶","海岸線長且都是岩岸組成"],"a":3,"e":"臺灣海岸類型多樣，並非『海岸線長且都是岩岸』，因此此項關聯最低。","code":"B2","section":"2-2 臺灣的位置及其影響","topic":"位置與生物多樣性","answerSource":"AI答案卷（使用者提供）","answerStatus":"已核對"},{"n":18,"q":"新台幣紙鈔背面有許多台灣特有的動植物，包括 2000 元的櫻花鉤吻鮭、1000 元的帝雉與塔塔加薊、500 元的野生梅花鹿。請問：台灣環境能孕育出許多特有生物的主要原因為何？","o":["冰河期後海平面上升","山脈阻擋","河川短而湍急","氣候暖濕"],"a":0,"e":"冰河期後海平面上升，使臺灣與亞洲大陸分隔，形成隔離環境，有利特有種形成。","code":"B2","section":"2-2 臺灣的位置及其影響","topic":"島嶼隔離與特有種","answerSource":"AI答案卷（使用者提供）","answerStatus":"已核對"},{"n":19,"q":"現在要規劃行程，很多人都會使用 Google Maps 來查詢目的地位於何處。請問：這種電子地圖有哪些傳統地圖沒有的優點？（甲）可知實際距離；（乙）可自由縮放比例；（丙）更新快速；（丁）方位標示清楚","o":["丙丁","乙丙","甲丁","甲乙"],"a":1,"e":"電子地圖可自由縮放比例並快速更新，因此為乙、丙。","code":"A4","section":"1-4 如何閱讀地圖","topic":"電子地圖","answerSource":"AI答案卷（使用者提供）","answerStatus":"已核對"},{"n":20,"q":"以下是地理老師和同學的對話，由對話的內容判斷，學生指的是哪一條經緯線？","o":["赤道","回歸線","本初經線","國際換日線"],"a":3,"e":"國際換日線大致沿 180° 經線，但為避開部分陸地與島嶼而彎折，因此選 D。","page":2,"focus":0.05,"code":"A3","section":"1-3 位置與生活的關聯","topic":"國際換日線","answerSource":"AI答案卷（使用者提供）","answerStatus":"已核對"}];
let idx=0;
let activeQ=Q.slice();
let state=JSON.parse(localStorage.getItem('juren_geo_demo')||'{}');
const SCOPE_ORDER=["A1","A2","A3","A4","B1","B2","B3"];
function buildScope(){
 const g=document.getElementById('scopeGrid'); g.innerHTML='';
 SCOPE_ORDER.forEach(code=>{
   const qs=Q.filter(q=>q.code===code); if(!qs.length)return;
   const sec=qs[0].section;
   const label=document.createElement('label'); label.className='scopeitem';
   label.innerHTML='<input type="checkbox" class="scopecheck" value="'+code+'" checked><div><b>'+code+'｜'+sec+'</b><small>'+qs.length+' 題</small></div>';
   g.appendChild(label);
 });
}
function selectAllScopes(v){document.querySelectorAll('.scopecheck').forEach(x=>x.checked=v)}
function startQuiz(){
 const codes=[...document.querySelectorAll('.scopecheck:checked')].map(x=>x.value);
 if(!codes.length){alert('請至少選擇一個範圍');return}
 activeQ=Q.filter(q=>codes.includes(q.code));
 idx=0;
 document.getElementById('startPanel').style.display='none';
 document.getElementById('quizLayout').style.display='grid';
 render();
}
function backToScope(){
 document.getElementById('quizLayout').style.display='none';
 document.getElementById('startPanel').style.display='block';
}

function save(){localStorage.setItem('juren_geo_demo',JSON.stringify(state))}
function st(n){return state[n]||(state[n]={sel:null,done:false,ok:null,fav:false})}
function render(){const q=activeQ[idx],s=st(q.n);document.getElementById('qnum').textContent='第 '+q.n+' 題';document.getElementById('sectag').textContent=q.code+'｜'+q.topic;document.getElementById('srcn').textContent=q.n;document.getElementById('qtext').textContent=q.q;const img=document.getElementById('figure');img.removeAttribute('src');img.style.display='none';const stl=document.getElementById('sourceTools');stl.style.display=q.page?'block':'none';document.getElementById('fav').textContent=s.fav?'★':'☆';document.getElementById('fav').onclick=()=>{s.fav=!s.fav;save();render()};const o=document.getElementById('opts');o.innerHTML='';q.o.forEach((t,i)=>{const d=document.createElement('div');d.className='opt'+(s.sel===i?' selected':'');if(s.done){if(i===q.a)d.classList.add('correct');if(i===s.sel&&i!==q.a)d.classList.add('incorrect')}d.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'.</span><span>'+t+'</span>';d.onclick=()=>{if(s.done)return;s.sel=i;save();render()};o.appendChild(d)});const fb=document.getElementById('fb');if(s.done){fb.className='feedback show '+(s.ok?'ok':'bad');fb.innerHTML='<b>'+(s.ok?'✓ 答對':'✗ 答錯')+'</b><br>你的答案：<b>'+String.fromCharCode(65+s.sel)+'</b><br>正確答案：<b>'+String.fromCharCode(65+q.a)+'</b><br><b>解析：</b>'+q.e+'<br><span style="font-size:12px;color:var(--muted)">答案來源：'+q.answerSource+'｜'+q.answerStatus+'</span>'}else{fb.className='feedback';fb.innerHTML=''};drawGrid();score()}
function submitQ(){const q=activeQ[idx],s=st(q.n);if(s.sel===null){alert('請先選擇答案');return}s.done=true;s.ok=s.sel===q.a;save();render()}
function prevQ(){idx=(idx-1+activeQ.length)%activeQ.length;render()}function nextQ(){idx=(idx+1)%activeQ.length;render()}
function drawGrid(){const g=document.getElementById('grid');g.innerHTML='';activeQ.forEach((q,i)=>{const s=st(q.n),b=document.createElement('button');b.className='qbtn'+(i===idx?' active':'')+(s.done?(s.ok?' done':' wrong'):'');b.textContent=q.n;b.onclick=()=>{idx=i;render()};g.appendChild(b)});const done=activeQ.filter(q=>st(q.n).done).length;document.getElementById('bar').style.width=(done/activeQ.length*100)+'%'}
function score(){const done=activeQ.filter(q=>st(q.n).done);const ok=done.filter(q=>st(q.n).ok).length;document.getElementById('score').textContent=ok+' / '+done.length}
function showWrong(){const i=activeQ.findIndex(q=>st(q.n).done&&!st(q.n).ok);if(i<0)alert('目前沒有錯題');else{idx=i;render()}}
function showFav(){const i=activeQ.findIndex(q=>st(q.n).fav);if(i<0)alert('目前沒有收藏題');else{idx=i;render()}}
function resetAll(){if(confirm('確定清除這份試用版的所有作答紀錄？')){state={};save();render()}}

let viewScale=1;
function openSource(){const q=activeQ[idx];if(!q.page)return;const v=document.getElementById('viewer'),im=document.getElementById('pageimg'),box=document.getElementById('viewbox');document.getElementById('viewerTitle').textContent='第 '+q.n+' 題｜原卷第 '+q.page+' 頁';im.src=PAGE_IMAGES[q.page];viewScale=1;im.style.width='100%';v.classList.add('show');requestAnimationFrame(()=>requestAnimationFrame(()=>{box.scrollTop=Math.max(0,(im.scrollHeight-box.clientHeight)*(q.focus||0));box.scrollLeft=0}))}
function closeSource(){document.getElementById('viewer').classList.remove('show')}
function zoom(d){const im=document.getElementById('pageimg'),box=document.getElementById('viewbox');if(d===0)viewScale=1;else viewScale=Math.min(3,Math.max(.5,viewScale+d));im.style.width=(viewScale*100)+'%';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSource()});
window.addEventListener("error",function(e){
  const q=document.getElementById("qtext");
  if(q) q.textContent="題目載入失敗，請關閉此預覽後改用 Safari 或 Chrome 開啟此檔案。";
});
buildScope();</script></body></html>
