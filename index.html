function codeOf(q){let m=(q.code||'').match(/^([A-Z]+\d?)/);return m?m[1]:(q.extra?'EXT':'其他')}

function initScopes(){const codes=['A1','A2','A3','A4','B1','B2','B3','EXT'];document.getElementById('scopeList').innerHTML=codes.map(c=>`<label><input type="checkbox" class="sc" value="${c}" ${c==='EXT'?'':'checked'}> ${labels[c]}</label>`).join('');updateStats();}
