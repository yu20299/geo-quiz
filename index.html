function startQuiz(){const scopes=selectedScopes();if(!scopes.length){alert('請至少選擇一個單元。');return;}ACTIVE=QUESTIONS.filter(q=>scopes.includes(q.section));answers={};lastAttempt=null;document.getElementById('scopePanel').classList.add('hidden');document.getElementById('progressPanel').classList.remove('hidden');document.getElementById('quizActions').classList.remove('hidden');document.getElementById('result').style.display='none';document.getElementById('scopeText').textContent='本次範圍：'+scopes.join('＋')+'｜共 '+ACTIVE.length+' 題';render();window.scrollTo({top:0,behavior:'smooth'});}

function render(){const root=document.getElementById('quiz');root.innerHTML='';ACTIVE.forEach((q,i)=>{const card=document.createElement('section');card.className='qcard';const tagtxt=q.tags.map(t=>`${t.role==='主要'?'主':'次'}:${t.code}`).join(' / ');let fig='';if(q.page_image){fig=`<button class="figure-btn" onclick="toggleFig(${i})">🖼 查看完整原卷第 ${q.page||''} 頁</button><div id="fig${i}" class="pageimg"><img src="${q.page_image}" alt="完整原卷頁面"></div>`}else if(q.link){fig=`<a class="figure-btn" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="${esc(q.link)}">🖼 查看完整原卷</a>`}else if(q.fig && q.fig!=='無'){fig=`<div class="note">🖼 本題需參照原卷圖｜原卷連結待補</div>`}let opts='';for(const k of ['A','B','C','D']){const v=q.options[k]; if(!v) continue; opts+=`<button id="o${i}${k}" class="opt" onclick="pick(${i},'${k}')"><b>${k}.</b> ${esc(v)}</button>`;}card.innerHTML=`<div class="qhead"><div><div class="qnum">第 ${i+1} 題</div><div class="meta">${esc(q.school)}｜原題 ${esc(q.qno)}｜${esc(q.section)}｜${tagtxt}</div></div></div><div class="qtext">${esc(q.text)}</div>${fig}${opts}`;root.appendChild(card);});updateProgress();}

function submitQuiz(){if(Object.keys(answers).length<ACTIVE.length){if(!confirm(`尚有 ${ACTIVE.length-Object.keys(answers).length} 題未作答，仍要先看診斷嗎？`))return;}const kp={};let correct=0,answered=0;const detail=[];ACTIVE.forEach((q,i)=>{const a=answers[i]||'';const ok=a && a===q.answer;if(a)answered++;if(ok)correct++;detail.push({sid:q.sid,school:q.school,qno:q.qno,answer:a,correct:q.answer,ok:!!ok});q.tags.forEach(t=>{if(!kp[t.code])kp[t.code]={name:t.name,total:0,good:0,primary:0,answeredWeight:0};kp[t.code].total+=t.weight;if(t.role==='主要')kp[t.code].primary+=t.weight;if(a){kp[t.code].answeredWeight+=t.weight;if(ok)kp[t.code].good+=t.weight;}})});
const rows=[];Object.entries(kp).forEach(([code,v])=>{const evidence=v.answeredWeight;const rate=evidence? v.good/evidence:0;let mastery='證據不足',cls='low';if(evidence>=MIN_EVIDENCE){if(rate>=.85){mastery='已掌握';cls='good'}else if(rate>=.70){mastery='尚可';cls='mid'}else{mastery='需補強';cls='bad'}}let conf=v.primary>=1.5?'高':(v.primary>=1?'中':'低');rows.push({code,...v,evidence,rate,mastery,cls,conf});});rows.sort((a,b)=>{const ord={'需補強':0,'尚可':1,'證據不足':2,'已掌握':3};return (ord[a.mastery]-ord[b.mastery])||(a.rate-b.rate)});

lastAttempt={timestamp:new Date().toISOString(),score:pct,answered,correct,detail,knowledge:rows};const hist=JSON.parse(localStorage.getItem('geo_a1a2_diag_attempts')||'[]');hist.push(lastAttempt);localStorage.setItem('geo_a1a2_diag_attempts',JSON.stringify(hist));document.getElementById('result').style.display='block';document.getElementById('result').scrollIntoView({behavior:'smooth'});}

function exportCSV(){if(!lastAttempt){alert('請先完成一次診斷。');return;}const lines=[['時間','來源題ID','學校','原題號','孩子答案','參考答案','是否答對']];lastAttempt.detail.forEach(d=>lines.push([lastAttempt.timestamp,d.sid,d.school,d.qno,d.answer,d.correct,d.ok?'是':'否']));lines.push([]);lines.push(['知識點','名稱','加權答對率','判定','可信度','有效權重']);lastAttempt.knowledge.forEach(r=>lines.push([r.code,r.name,Math.round(r.rate*100)+'%',r.mastery,r.conf,r.evidence.toFixed(2)]));const csv='\ufeff'+lines.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='A1A2診斷_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href);}
