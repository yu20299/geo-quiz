const STORE='geo_adaptive_history_v14';
const MIN_EVIDENCE=1.35;
let ACTIVE=[], idx=0, currentPick='', locked=false, session=[] , lastResult=null, selectedUnits=[];
const MODE_HELP={lesson:'優先補未做過與證據不足知識點，適合剛讀完課本。',review:'讓所選範圍各知識點都有機會出現，避免只抽到題量多的主題。',weak:'70%針對歷史弱點，30%混合複習；沒有足夠歷史資料時會自動改用課後小測。',due:'優先抽已到複習日的錯題／舊題；不足時補相同知識點的新題。',mock:'跨單元平均分配，兼顧難度與來源分散，模擬段考。'};
function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m));}
function history(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){return []}}
function saveHistory(rows){const h=history();h.push(...rows);localStorage.setItem(STORE,JSON.stringify(h));}
function daysFromNow(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function renderSetup(){const g=document.getElementById('scopeGrid');g.innerHTML='';for(const [u,m] of Object.entries(SECTIONS)){const el=document.createElement('label');el.className='scope';el.innerHTML=`<input type="checkbox" class="scopeCheck" value="${u}" checked><span><b>${esc(m[0])}</b><br><span class="small">${esc(m[1])}</span></span>`;g.appendChild(el)}document.getElementById('modeHelp').textContent=MODE_HELP[document.getElementById('mode').value];updatePoolInfo();}
function scopeSelected(){return [...document.querySelectorAll('.scopeCheck:checked')].map(x=>x.value)}
function updatePoolInfo(){const units=scopeSelected();const pool=QUESTIONS.filter(q=>units.includes(q.unit));const kps=new Set(pool.map(q=>q.kp));document.getElementById('poolInfo').innerHTML=`目前可直接在網頁出題：<b>${pool.length}</b> 題｜涵蓋 <b>${kps.size}</b> 個主要知識點。需要原圖但尚未補Dropbox連結的題目不會被抽出。`;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function latestBySid(h){const m={};h.forEach(x=>{m[x.sid]=x});return m}
function computeKP(h, units){const out={};h.filter(x=>!units||units.includes(x.unit)).forEach(x=>{(x.tags||[]).forEach(t=>{const w=(t.weight||0)*(x.answerTrust||1);if(!out[t.code])out[t.code]={good:0,total:0,primary:0,name:t.name};out[t.code].total+=w;if(t.role==='主要')out[t.code].primary+=w;if(x.ok)out[t.code].good+=w})});return out}
function kpStatus(v){if(!v||v.total<MIN_EVIDENCE)return '證據不足';const r=v.good/v.total;return r>=.85?'已掌握':r>=.70?'尚可':'需補強'}
function targetDifficulty(mode, step){const seq={lesson:['basic','medium','basic','medium','basic','medium','basic','medium','advanced','medium'],review:['basic','medium','medium','basic','medium','medium','advanced','basic','medium','medium'],weak:['basic','medium','medium','basic','medium','medium','basic','medium','medium','medium'],mock:['basic','medium','medium','basic','medium','advanced','medium','basic','medium','medium']}[mode]||['basic','medium'];return seq[step%seq.length]}
function chooseBalanced(pool,n,mode,units){const h=history(), latest=latestBySid(h), kpHist=computeKP(h,units);const kpPool=[...new Set(pool.map(q=>q.kp))];const exposure={};kpPool.forEach(k=>exposure[k]=(kpHist[k]?.total||0));let weak=kpPool.filter(k=>kpStatus(kpHist[k])==='需補強');if(mode==='weak'&&!weak.length)mode='lesson';const selected=[], mids=new Set(), schools=CounterObj();let due=[];if(mode==='due'){const today=new Date().toISOString().slice(0,10);due=pool.filter(q=>latest[q.sid]&&latest[q.sid].nextReview&&latest[q.sid].nextReview<=today);shuffle(due);for(const q of due){if(selected.length>=n)break;if(!mids.has(q.mid)){selected.push(q);mids.add(q.mid);schools[q.school]=(schools[q.school]||0)+1}}}
while(selected.length<n){let kp;
 if(mode==='weak'&&weak.length&&Math.random()<.70)kp=weak[Math.floor(Math.random()*weak.length)];
 else {const sorted=[...kpPool].sort((a,b)=>(exposure[a]||0)-(exposure[b]||0)+Math.random()*.2);kp=sorted[selected.length%sorted.length];}
 let cand=pool.filter(q=>q.kp===kp&&!mids.has(q.mid)); if(!cand.length)cand=pool.filter(q=>!mids.has(q.mid)); if(!cand.length)break;
 const diff=targetDifficulty(mode,selected.length);cand.sort((a,b)=>scoreQ(b,diff,latest,schools)-scoreQ(a,diff,latest,schools));const q=cand[0];selected.push(q);mids.add(q.mid);schools[q.school]=(schools[q.school]||0)+1;exposure[q.kp]=(exposure[q.kp]||0)+1;
 }
 return selected.slice(0,n);
}
function CounterObj(){return {}}
function scoreQ(q,diff,latest,schools){let s=(q.answerTrust||.75)*20+(q.difficulty===diff?12:0)-(schools[q.school]||0)*5;const l=latest[q.sid];if(!l)s+=10;else{const age=(Date.now()-new Date(l.timestamp).getTime())/86400000;if(age<3)s-=18;if(!l.ok)s+=8}return s+Math.random()*3}
function startQuiz(forceMode){selectedUnits=scopeSelected();if(!selectedUnits.length){alert('請至少選擇一個單元');return;}let mode=forceMode||document.getElementById('mode').value;let n=parseInt(document.getElementById('count').value,10);const pool=QUESTIONS.filter(q=>selectedUnits.includes(q.unit));if(!pool.length){alert('目前所選範圍沒有可直接在網頁出題的題目');return;}if(mode==='mock'&&n<20)n=30;ACTIVE=chooseBalanced(pool,Math.min(n,pool.length),mode,selectedUnits);if(!ACTIVE.length){alert('目前沒有符合這個模式的題目');return;}idx=0;session=[];currentPick='';locked=false;document.getElementById('setup').classList.add('hidden');document.getElementById('historyPanel').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('quizHead').classList.remove('hidden');document.getElementById('quiz').classList.remove('hidden');document.getElementById('quizTitle').textContent=document.getElementById('mode').selectedOptions[0].textContent;document.getElementById('scopeText').textContent=selectedUnits.map(u=>SECTIONS[u][0]).join('＋');renderQuestion();window.scrollTo({top:0,behavior:'smooth'});}
function renderQuestion(){const q=ACTIVE[idx];locked=false;currentPick='';document.getElementById('qCounter').textContent=`第 ${idx+1}/${ACTIVE.length} 題`;document.getElementById('prog').style.width=(idx/ACTIVE.length*100)+'%';let source='';if(q.fig&&q.fig!=='無'&&q.link)source=`<a class="sourcebtn" target="_blank" rel="noopener" href="${esc(q.link)}">🖼 查看完整原卷第 ${esc(q.page||'')} 頁</a>`;let opts=['A','B','C','D'].map(k=>`<button class="opt" id="opt${k}" onclick="pick('${k}')"><b>${k}.</b> ${esc(q.options[k])}</button>`).join('');document.getElementById('quiz').innerHTML=`<section class="card"><div class="meta">${esc(q.year)}-1-1 ${esc(q.school)}｜原題 ${esc(q.qno)}｜${esc(q.difficultyLabel||'')}</div><div class="qtext">${esc(q.text)}</div>${source}${opts}<div id="fb"></div><div class="sticky"><button id="checkBtn" class="btn primary" onclick="checkAnswer()">確認答案</button><button class="btn secondary" onclick="backSetup()">離開本次測驗</button></div></section>`;}
function pick(k){if(locked)return;currentPick=k;['A','B','C','D'].forEach(x=>document.getElementById('opt'+x)?.classList.toggle('sel',x===k))}
function reviewDays(q,ok){const h=history().filter(x=>x.sid===q.sid);if(!ok)return 2;let streak=1;for(let i=h.length-1;i>=0;i--){if(h[i].ok)streak++;else break}return streak>=4?30:streak===3?14:streak===2?7:4}

function isGoodText(v){return typeof v==='string'&&v.trim()&&!v.trim().startsWith('=')}
function supplementsFor(q){let out=[];if(isGoodText(q.extra))out.push({title:'補充解析',content:q.extra});for(const key of [q.sid,q.code]){(SUPPLEMENT[key]||[]).forEach(x=>out.push(x));}return out}
function directLinks(q){return (q.tags||[]).filter(t=>t.role!=='主要').map(t=>`${t.code} ${t.name}`).join('、')}
function renderSupplement(q){const xs=supplementsFor(q);if(!xs.length)return '';return `<details class="learnbox"><summary>補充解析 ${xs.length>1?'（'+xs.length+'則）':''}</summary><div class="learncontent">${xs.map(x=>`<div class="extra-item"><b>${esc(x.title||'補充解析')}</b><div>${esc(x.content||'')}</div></div>`).join('')}</div></details>`}
function renderPlane(q){const p=PLANE[q.kp]||{};const direct=directLinks(q);const deep=document.getElementById('learnMode')?.value==='deep';return `<details class="learnbox" ${deep?'open':''}><summary>點・線・面知識延伸</summary><div class="learncontent"><div class="plrow"><b>點</b> ${esc(q.kp)} ${esc(q.kpname||'')}<div>${esc(p.point||'本題核心知識點已標記，內容待後續補強。')}</div></div><div class="plrow"><b>線</b> ${direct?`本題直接連到：${esc(direct)}<br>`:''}${esc(p.line||'關聯知識待後續建立。')}</div><div class="plrow"><b>面</b> ${esc(p.surface||'整合知識網待後續建立。')}</div><div class="plrow"><b>延伸</b> ${esc(p.extension||'延伸題型待後續建立。')}</div></div></details>`}
function checkAnswer(){if(locked)return;if(!currentPick){alert('請先選一個答案');return;}locked=true;const q=ACTIVE[idx],ok=currentPick===q.answer;['A','B','C','D'].forEach(x=>{const e=document.getElementById('opt'+x);if(e)e.classList.add('locked')});const ansLabel=q.answerTrust>=.99?'正確答案':'參考答案';const base=isGoodText(q.analysis)?esc(q.analysis):'<span class="pending">本題基本解析尚待母題庫逐題校正；目前不顯示未計算或未核對內容。</span>';const mistake=isGoodText(q.mistake)?`<div><b>易錯提醒：</b>${esc(q.mistake)}</div>`:'';document.getElementById('fb').innerHTML=`<div class="feedback ${ok?'fb-good':'fb-bad'}"><b>${ok?'答對了':'需要再看一次'}</b><div>${ansLabel}：<b>${esc(q.answer)}</b>｜答案來源：${esc(q.answerSource)}（診斷係數 ${q.answerTrust.toFixed(2)}）</div><div class="base-analysis"><b>基本解析：</b>${base}</div>${mistake}<div class="small">主要知識點：${esc(q.kp)} ${esc(q.kpname||'')}</div></div>${renderSupplement(q)}${renderPlane(q)}<div class="actions"><button class="btn primary" onclick="nextQuestion()">${idx===ACTIVE.length-1?'完成並看診斷':'下一題'}</button></div>`;const days=reviewDays(q,ok);session.push({timestamp:new Date().toISOString(),sid:q.sid,mid:q.mid,unit:q.unit,kp:q.kp,tags:q.tags,difficulty:q.difficulty,answer:currentPick,correct:q.answer,ok,answerTrust:q.answerTrust,nextReview:daysFromNow(days),school:q.school,qno:q.qno,mode:document.getElementById('mode').value,learnMode:document.getElementById('learnMode')?.value||'child'});}
function nextQuestion(){if(idx<ACTIVE.length-1){idx++;renderQuestion();window.scrollTo({top:0,behavior:'smooth'});}else finishQuiz()}
function finishQuiz(){saveHistory(session);const kp=computeKP(session,selectedUnits);let correct=session.filter(x=>x.ok).length;const rows=[];Object.entries(kp).forEach(([code,v])=>{const rate=v.total?v.good/v.total:0;const mastery=kpStatus(v);const conf=v.primary>=1.5?'高':v.primary>=1?'中':'低';rows.push({code,name:v.name||KPNAMES[code]||'',rate,mastery,conf,total:v.total})});const ord={'需補強':0,'尚可':1,'證據不足':2,'已掌握':3};rows.sort((a,b)=>(ord[a.mastery]-ord[b.mastery])||(a.rate-b.rate));lastResult={session,rows};document.getElementById('quiz').classList.add('hidden');document.getElementById('quizHead').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('summary').innerHTML=`<div class="bigscore">${Math.round(correct/session.length*100)}%</div><div>本次 ${session.length} 題，答對 ${correct} 題。</div><div class="small">知識點答對率已乘上答案可信度與主要/次要標籤權重。</div>`;document.getElementById('kpRows').innerHTML=rows.map(r=>`<div class="krow"><div><b>${esc(r.code)}</b> ${esc(r.name)}<div class="small">有效證據 ${r.total.toFixed(2)}</div></div><div>${Math.round(r.rate*100)}%</div><div><span class="tag ${r.mastery==='已掌握'?'good':r.mastery==='尚可'?'mid':r.mastery==='需補強'?'bad':'low'}">${r.mastery}</span></div><div>${r.conf}</div></div>`).join('');const weak=rows.filter(r=>r.mastery==='需補強');document.getElementById('weakBox').innerHTML=weak.length?`<div class="weakbox"><b>下一輪優先補強</b><br>${weak.slice(0,4).map((r,i)=>`${i+1}. ${esc(r.code)} ${esc(r.name)}（${Math.round(r.rate*100)}%）`).join('<br>')}<div class="small" style="margin-top:6px">弱點補強模式會以70%弱點題＋30%混合題重新出題。</div></div>`:`<div class="note">目前沒有達到「需補強」門檻的知識點；證據不足的項目仍會在後續課後小測優先補題。</div>`;document.getElementById('result').scrollIntoView({behavior:'smooth'});}

function backSetup(){ACTIVE=[];session=[];idx=0;document.getElementById('quiz').classList.add('hidden');document.getElementById('quizHead').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('historyPanel').classList.add('hidden');document.getElementById('setup').classList.remove('hidden');updatePoolInfo();window.scrollTo({top:0,behavior:'smooth'});}
function showHistory(){const h=history();document.getElementById('setup').classList.add('hidden');document.getElementById('historyPanel').classList.remove('hidden');if(!h.length){document.getElementById('historyContent').innerHTML='<div class="note">目前尚無作答紀錄。</div>';return;}const latest=h.slice(-200);const correct=latest.filter(x=>x.ok).length;const k=computeKP(latest,null);const weak=Object.entries(k).map(([code,v])=>({code,name:v.name||KPNAMES[code]||'',status:kpStatus(v),rate:v.total?v.good/v.total:0,total:v.total})).filter(x=>x.status==='需補強').sort((a,b)=>a.rate-b.rate);const dueToday=latestBySid(h);const today=new Date().toISOString().slice(0,10);const due=Object.values(dueToday).filter(x=>x.nextReview&&x.nextReview<=today).length;document.getElementById('historyContent').innerHTML=`<div class="statgrid"><div class="stat"><b>${h.length}</b><div class="small">累積作答</div></div><div class="stat"><b>${Math.round(correct/latest.length*100)}%</b><div class="small">近${latest.length}筆答對率</div></div><div class="stat"><b>${weak.length}</b><div class="small">需補強知識點</div></div><div class="stat"><b>${due}</b><div class="small">到期複習題</div></div></div>${weak.length?`<div class="weakbox"><b>目前弱點</b><br>${weak.slice(0,8).map(x=>`${esc(x.code)} ${esc(x.name)} ${Math.round(x.rate*100)}%`).join('<br>')}</div>`:''}`;}
function exportCSV(){if(!lastResult){alert('請先完成一次練習');return;}const lines=[['時間','來源題ID','母題ID','單元','主要知識點','孩子答案','參考答案','是否答對','答案診斷係數','下次複習日','學習顯示模式']];lastResult.session.forEach(x=>lines.push([x.timestamp,x.sid,x.mid,x.unit,x.kp,x.answer,x.correct,x.ok?'是':'否',x.answerTrust,x.nextReview,x.learnMode||'child']));lines.push([]);lines.push(['知識點','名稱','加權答對率','判定','可信度','有效證據']);lastResult.rows.forEach(r=>lines.push([r.code,r.name,Math.round(r.rate*100)+'%',r.mastery,r.conf,r.total.toFixed(2)]));const csv='\ufeff'+lines.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='地理自適應作答_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('mode').addEventListener('change',e=>document.getElementById('modeHelp').textContent=MODE_HELP[e.target.value]);document.addEventListener('change',e=>{if(e.target.classList.contains('scopeCheck'))updatePoolInfo()});renderSetup();document.getElementById('modeHelp').textContent=MODE_HELP[document.getElementById('mode').value];
</script></body></html>
